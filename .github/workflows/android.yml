name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del motor de cálculo
        run: ./gradlew testDebugUnitTest --stacktrace

      # Si el repositorio tiene el secreto KEYSTORE_BASE64, se firma con la clave de subida.
      - name: Preparar firma de subida
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Firma de subida configurada"
          else
            echo "Sin secreto KEYSTORE_BASE64: se firma con la clave de depuración"
          fi

      - name: Compilar APK y AAB (Play Store)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-ian-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Subir capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-pantalla
          path: app/build/screenshots/*.png
          if-no-files-found: ignore

      # Copia las capturas a la rama "capturas" para poder verlas sin descargar artefactos.
      - name: Publicar capturas en la rama capturas
        if: always() && github.event_name == 'push'
        run: |
          if ls app/build/screenshots/*.png >/dev/null 2>&1; then
            cd app/build/screenshots
            git init -q
            git checkout -q -b capturas
            git add *.png
            git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Capturas de ${GITHUB_SHA::7}"
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" capturas
          fi

      - name: Subir AAB para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-ian-playstore-aab
          path: app/build/outputs/bundle/release/*.aab
